parameters:
  behat_steps.backend.drupal.class: DrevOps\BehatSteps\Backend\Drupal\DrupalBackend
  behat_steps.random.class: DrevOps\BehatSteps\Backend\Random\RandomGenerator

services:
  behat_steps.backend.random:
    class: "%behat_steps.random.class%"
  behat_steps.backend.drupal:
    class: "%behat_steps.backend.drupal.class%"
    # Built on first use, after Behat registers its 'autoload' paths, so the
    # classes the options name can live there.
    lazy: true
    arguments:
      - "%behat_steps.backend.drupal.drupal_root%"
      - "%mink.base_url%"
      - "%behat_steps.backend.drupal.core%"
      - "@behat_steps.backend.random"
    tags:
      - { name: behat_steps.backend, alias: drupal }
