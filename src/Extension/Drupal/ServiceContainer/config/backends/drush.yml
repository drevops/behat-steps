parameters:
  behat_steps.backend.drush.class: DrevOps\BehatSteps\Backend\Drupal\DrushBackend
  behat_steps.random.class: DrevOps\BehatSteps\Backend\Random\RandomGenerator

services:
  behat_steps.backend.random:
    class: "%behat_steps.random.class%"
  behat_steps.backend.drush:
    class: "%behat_steps.backend.drush.class%"
    # Built on first use, after Behat registers its 'autoload' paths, so the
    # classes the options name can live there.
    lazy: true
    arguments:
      - "%behat_steps.backend.drush.alias%"
      - "%behat_steps.backend.drush.root%"
      - "%behat_steps.backend.drush.binary%"
      - "@behat_steps.backend.random"
    tags:
      - { name: behat_steps.backend, alias: drush }
