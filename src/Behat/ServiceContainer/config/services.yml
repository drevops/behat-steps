parameters:
  behat_steps.backend_registry.class: DrevOps\BehatSteps\Behat\Registry\BackendRegistry
  behat_steps.authenticator.class: DrevOps\BehatSteps\Behat\Auth\Authenticator
  behat_steps.basic_authenticator.class: DrevOps\BehatSteps\Behat\Auth\BasicAuthenticator
  behat_steps.user_registry.class: DrevOps\BehatSteps\Behat\Registry\UserRegistry
  behat_steps.scenario_tag_registry.class: DrevOps\BehatSteps\Behat\Registry\ScenarioTagRegistry
  behat_steps.config.schema_reader.class: DrevOps\BehatSteps\Behat\Config\ConfigSchemaReader
  behat_steps.config.tag_overrides.class: DrevOps\BehatSteps\Behat\Config\TagOverrides
  behat_steps.config.resolver_factory.class: DrevOps\BehatSteps\Behat\Config\TraitOptionResolverFactory
  behat_steps.http_client_factory.class: DrevOps\BehatSteps\Behat\Http\HttpClientFactory
  behat_steps.context.initializer.class: DrevOps\BehatSteps\Behat\Context\Initializer\BackendAwareInitializer
  behat_steps.context.attribute_reader.class: DrevOps\BehatSteps\Behat\Context\Attribute\HookAttributeReader
  behat_steps.listener.backend.class: DrevOps\BehatSteps\Behat\Listener\BackendListener
  behat_steps.listener.skip_tag.class: DrevOps\BehatSteps\Behat\Listener\SkipTagListener
  behat_steps.region_selector.class: DrevOps\BehatSteps\Behat\Selector\RegionSelector
  behat_steps.parameters: {}
  behat_steps.regions: {}
  behat_steps.backends: {}

services:
  behat_steps.backend_registry:
    class: "%behat_steps.backend_registry.class%"
    arguments:
      - {}
  behat_steps.basic_authenticator:
    class: "%behat_steps.basic_authenticator.class%"
    arguments:
      - "@mink"
      - "%mink.parameters%"
  behat_steps.authenticator:
    class: "%behat_steps.authenticator.class%"
    arguments:
      - "@mink"
      - "@behat_steps.user_registry"
      - "@behat_steps.backend_registry"
      - "@behat_steps.basic_authenticator"
      - "%mink.parameters%"
      - "%behat_steps.parameters%"
  behat_steps.user_registry:
    class: "%behat_steps.user_registry.class%"
  behat_steps.scenario_tag_registry:
    class: "%behat_steps.scenario_tag_registry.class%"
  behat_steps.config.schema_reader:
    class: "%behat_steps.config.schema_reader.class%"
  behat_steps.config.tag_overrides:
    class: "%behat_steps.config.tag_overrides.class%"
  behat_steps.config.resolver_factory:
    class: "%behat_steps.config.resolver_factory.class%"
    arguments:
      - "@behat_steps.config.schema_reader"
      - "@behat_steps.scenario_tag_registry"
      - "@behat_steps.config.tag_overrides"
  behat_steps.http_client_factory:
    class: "%behat_steps.http_client_factory.class%"
    arguments:
      - "@behat_steps.http_client"
      - "%mink.base_url%"
  behat_steps.context.initializer:
    class: "%behat_steps.context.initializer.class%"
    arguments:
      - "@behat_steps.backend_registry"
      - "%behat_steps.parameters%"
      - "@hook.dispatcher"
      - "@behat_steps.basic_authenticator"
      - "@behat_steps.authenticator"
      - "@behat_steps.user_registry"
      - "@behat_steps.config.resolver_factory"
      - "@behat_steps.http_client_factory"
    tags:
      - { name: context.initializer }
  behat_steps.context.attribute_reader:
    class: "%behat_steps.context.attribute_reader.class%"
    tags:
      - { name: context.attribute_reader }
  behat_steps.listener.backend:
    class: "%behat_steps.listener.backend.class%"
    arguments:
      - "@behat_steps.backend_registry"
      - "@behat_steps.scenario_tag_registry"
      - "%behat_steps.backends%"
    tags:
      - { name: event_dispatcher.subscriber, priority: 0 }
  behat_steps.listener.skip_tag:
    class: "%behat_steps.listener.skip_tag.class%"
    tags:
      - { name: event_dispatcher.subscriber, priority: 0 }
  behat_steps.region_selector:
    class: "%behat_steps.region_selector.class%"
    arguments:
      - "@mink.selector.css"
      - "%behat_steps.regions%"
    tags:
      - { name: mink.selector, alias: region }
