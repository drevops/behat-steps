parameters:
  behat_steps.driver_registry.class: DrevOps\BehatSteps\Behat\Manager\DriverRegistry
  behat_steps.authenticator.class: DrevOps\BehatSteps\Behat\Manager\Authenticator
  behat_steps.basic_authenticator.class: DrevOps\BehatSteps\Behat\Manager\BasicAuthenticator
  behat_steps.user_registry.class: DrevOps\BehatSteps\Behat\Manager\UserRegistry
  behat_steps.scenario_tag_registry.class: DrevOps\BehatSteps\Behat\Manager\ScenarioTagRegistry
  behat_steps.config.schema_reader.class: DrevOps\BehatSteps\Behat\Config\ConfigSchemaReader
  behat_steps.config.tag_overrides.class: DrevOps\BehatSteps\Behat\Config\TagOverrides
  behat_steps.config.resolver_factory.class: DrevOps\BehatSteps\Behat\Config\TraitOptionResolverFactory
  behat_steps.context.initializer.class: DrevOps\BehatSteps\Behat\Context\Initializer\DriverAwareInitializer
  behat_steps.context.attribute_reader.class: DrevOps\BehatSteps\Behat\Context\Attribute\HookAttributeReader
  behat_steps.listener.driver.class: DrevOps\BehatSteps\Behat\Listener\DriverListener
  behat_steps.listener.skip_tag.class: DrevOps\BehatSteps\Behat\Listener\SkipTagListener
  behat_steps.tester.setup_failure.class: DrevOps\BehatSteps\Behat\Tester\SetupFailureScenarioTester
  behat_steps.region_selector.class: DrevOps\BehatSteps\Behat\Selector\RegionSelector
  behat_steps.parameters: {}
  behat_steps.regions: {}
  behat_steps.drivers: {}

services:
  behat_steps.driver_registry:
    class: "%behat_steps.driver_registry.class%"
    arguments:
      - {}
  behat_steps.basic_authenticator:
    class: "%behat_steps.basic_authenticator.class%"
    arguments:
      - "@mink"
      - "%mink.parameters%"
  behat_steps.authenticator:
    class: "%behat_steps.authenticator.class%"
    arguments:
      - "@mink"
      - "@behat_steps.user_registry"
      - "@behat_steps.driver_registry"
      - "@behat_steps.basic_authenticator"
      - "%mink.parameters%"
      - "%behat_steps.parameters%"
  behat_steps.user_registry:
    class: "%behat_steps.user_registry.class%"
  behat_steps.scenario_tag_registry:
    class: "%behat_steps.scenario_tag_registry.class%"
  behat_steps.config.schema_reader:
    class: "%behat_steps.config.schema_reader.class%"
  behat_steps.config.tag_overrides:
    class: "%behat_steps.config.tag_overrides.class%"
  behat_steps.config.resolver_factory:
    class: "%behat_steps.config.resolver_factory.class%"
    arguments:
      - "@behat_steps.config.schema_reader"
      - "@behat_steps.scenario_tag_registry"
      - "@behat_steps.config.tag_overrides"
  behat_steps.context.initializer:
    class: "%behat_steps.context.initializer.class%"
    arguments:
      - "@behat_steps.driver_registry"
      - "%behat_steps.parameters%"
      - "@hook.dispatcher"
      - "@behat_steps.basic_authenticator"
      - "@behat_steps.authenticator"
      - "@behat_steps.user_registry"
      - "@behat_steps.config.resolver_factory"
    tags:
      - { name: context.initializer }
  behat_steps.context.attribute_reader:
    class: "%behat_steps.context.attribute_reader.class%"
    tags:
      - { name: context.attribute_reader }
  behat_steps.listener.driver:
    class: "%behat_steps.listener.driver.class%"
    arguments:
      - "@behat_steps.driver_registry"
      - "@behat_steps.scenario_tag_registry"
      - "%behat_steps.drivers%"
    tags:
      - { name: event_dispatcher.subscriber, priority: 0 }
  behat_steps.listener.skip_tag:
    class: "%behat_steps.listener.skip_tag.class%"
    tags:
      - { name: event_dispatcher.subscriber, priority: 0 }
  # Priority 0 nests each wrapper inside the tester that dispatches the
  # scenario events and around the one that dispatches the hooks. Behat sets
  # both priorities in EventDispatcherExtension and HookExtension.
  behat_steps.tester.setup_failure.scenario:
    class: "%behat_steps.tester.setup_failure.class%"
    arguments:
      - "@tester.scenario"
    tags:
      - { name: tester.scenario.wrapper, priority: 0 }
  behat_steps.tester.setup_failure.example:
    class: "%behat_steps.tester.setup_failure.class%"
    arguments:
      - "@tester.example"
    tags:
      - { name: tester.example.wrapper, priority: 0 }
  behat_steps.region_selector:
    class: "%behat_steps.region_selector.class%"
    arguments:
      - "@mink.selector.css"
      - "%behat_steps.regions%"
    tags:
      - { name: mink.selector, alias: region }
