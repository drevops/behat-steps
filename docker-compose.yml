# For reference, @see https://github.com/drevops/scaffold/blob/main/docker-compose.yml
x-project:
  &project ${PROJECT:-behat-steps}

x-url:
  &url ${LOCALDEV_URL:-http://behat-steps.docker.amazee.io}

x-volumes:
  &default-volumes
  volumes:
    - .:/app:${VOLUME_FLAGS:-delegated} ### Local overrides to mount host filesystem. Automatically removed in CI.
    ##- app:/app # Override for environment without host mounts. Automatically uncommented in CI.

x-user:
  &default-user
  user: '1000'

x-environment:
  &default-environment
  PROJECT: *project
  WEBROOT: build/web
  LOCALDEV_URL: *url
  LAGOON_LOCALDEV_URL: *url
  CI: ${CI:-}
  XDEBUG_ENABLE: ${XDEBUG_ENABLE:-}
  DEPS: ${DEPS:-normal}
  DRUPAL_VERSION: ${DRUPAL_VERSION:-11}
  PHP_VERSION: ${PHP_VERSION:-8.3}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  PHP_MEMORY_LIMIT: 2048M

services:

  cli:
    build:
      context: .
      dockerfile: .docker/cli.dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    <<: *default-volumes
    user: root
    expose:
      - "8888"
    environment:
      <<: *default-environment
    volumes_from: ### Local overrides to mount host SSH keys. Automatically removed in CI.
      - container:amazeeio-ssh-agent ### Local overrides to mount host SSH keys. Automatically removed in CI.

  php:
    image: uselagoon/php-${PHP_VERSION:-8.3}-fpm:26.2.0
    <<: [*default-volumes, *default-user]
    environment:
      <<: *default-environment
    depends_on:
      - cli

  nginx:
    image: uselagoon/nginx-drupal:26.9.0@sha256:4f6c21710ffad0fa7ef0509178e00a1b79a8ce013a0f4f9470f4ab04ef8e15c0
    <<: [*default-volumes, *default-user]
    environment:
      <<: *default-environment
    depends_on:
      - cli
    networks:
      - amazeeio-network ### This network is supported by Pygmy and used to route all requests to host machine locally. Removed in CI.
      - default

  mariadb:
    image: uselagoon/mariadb-10.6-drupal:26.9.0@sha256:139e5a138b16fb5f9c8675e6290480d5be4ffdac1f75dfa81ea66cfd907c9aa0
    environment:
      <<: *default-environment
    ports:
      - "3306"

  chrome:
    image: selenium/standalone-chromium:152.0@sha256:08fd293648e126275782c616a61f4ee1d90cf413b1972ebc35dbd054d6789f55
    ports:
      - "7900" # Access Chrome using noVNC at http://behat-steps.docker.amazee.io:7900/?autoconnect=1&password=secret
    expose:
      - "8888"
    shm_size: '1gb'
    <<: *default-volumes
    environment:
      <<: *default-environment
    depends_on:
      - cli

  chrome_headless:
    image: chromedp/headless-shell:152.0.7939.3@sha256:f7e7ac721b023cb8717f8108aef8b3e49995fb1e5a912f41e570c29e45d24961
    shm_size: '1gb'
    expose:
      - "9222"
    depends_on:
      - cli

  # Helper container to wait for services to become available.
  wait_dependencies:
    image: drevops/docker-wait-for-dependencies:26.6.1@sha256:ff47894232111c3ba3ae28eef447e039999ac47039296cf187b56c1195e241d8
    depends_on:
      - cli
      - mariadb
      - chrome_headless
    command: mariadb:3306 chrome_headless:9222

networks:           ### Use external networks locally. Automatically removed in CI.
  amazeeio-network: ### Automatically removed in CI.
    external: true  ### Automatically removed in CI.

volumes:
  app: {}
