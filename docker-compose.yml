# For reference, @see https://github.com/drevops/scaffold/blob/main/docker-compose.yml
x-project:
  &project ${PROJECT:-behat-steps}

x-url:
  &url ${LOCALDEV_URL:-http://${COMPOSE_PROJECT_NAME:-behat-steps}.docker.amazee.io}

x-volumes:
  &default-volumes
  volumes:
    - .:/app:${VOLUME_FLAGS:-delegated} ### Local overrides to mount host filesystem. Automatically removed in CI.
    ##- app:/app # Override for environment without host mounts. Automatically uncommented in CI.

x-user:
  &default-user
  user: '1000'

x-environment:
  &default-environment
  PROJECT: *project
  WEBROOT: build/web
  LOCALDEV_URL: *url
  LAGOON_LOCALDEV_URL: *url
  CI: ${CI:-}
  XDEBUG_ENABLE: ${XDEBUG_ENABLE:-}
  DEPS: ${DEPS:-normal}
  DRUPAL_VERSION: ${DRUPAL_VERSION:-11}
  BEHAT: ${BEHAT:-3}
  PHP_VERSION: ${PHP_VERSION:-8.3}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  PHP_MEMORY_LIMIT: 2048M

services:

  cli:
    build:
      context: .
      dockerfile: .docker/cli.dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    <<: *default-volumes
    user: root
    expose:
      - "8888"
    environment:
      <<: *default-environment
    volumes_from: ### Local overrides to mount host SSH keys. Automatically removed in CI.
      - container:amazeeio-ssh-agent ### Local overrides to mount host SSH keys. Automatically removed in CI.

  php:
    image: uselagoon/php-${PHP_VERSION:-8.3}-fpm:26.11.1
    <<: [*default-volumes, *default-user]
    environment:
      <<: *default-environment
    depends_on:
      - cli

  nginx:
    image: uselagoon/nginx-drupal:26.11.1@sha256:0e3d6e0ee6c66232ff50a4661f5620fe341baeb0bd4fb078f7785c5c9c1035c7
    <<: [*default-volumes, *default-user]
    environment:
      <<: *default-environment
    depends_on:
      - cli
    networks:
      - amazeeio-network ### This network is supported by Pygmy and used to route all requests to host machine locally. Removed in CI.
      - default

  mariadb:
    image: uselagoon/mariadb-10.11-drupal:26.11.1@sha256:a3cdffbbc855f2e6e42ea8884cc7050925d799528c5d876bf582af0af61d7765
    environment:
      <<: *default-environment
    ports:
      - "3306"

  chrome:
    image: selenium/standalone-chromium:156.0@sha256:b211549a4c35f11826bc1a7559b9f23ff055198517f8cb7d49ef74df01c5e38d
    ports:
      - "7900" # Find the noVNC URL on host with 'ahoy info'.
    expose:
      - "8888"
    shm_size: '1gb'
    <<: *default-volumes
    environment:
      <<: *default-environment
    depends_on:
      - cli

  chrome_headless:
    image: chromedp/headless-shell:159.0.8144.0@sha256:691a2f658d68e9855d4be3611b6818378c40bb92a0381a1a239db5c021117e9f
    shm_size: '1gb'
    expose:
      - "9222"
    depends_on:
      - cli

  wait_dependencies:
    image: drevops/docker-wait-for-dependencies:26.10.0@sha256:0a44e138673116e9cfa3e94dd4df29c97f56c0b8f0fdee58c1dc123dd9b52b08
    depends_on:
      - cli
      - mariadb
      - chrome_headless
    command: mariadb:3306 chrome_headless:9222

networks:           ### Use external networks locally. Automatically removed in CI.
  amazeeio-network: ### Automatically removed in CI.
    external: true  ### Automatically removed in CI.

volumes:
  app: {}
