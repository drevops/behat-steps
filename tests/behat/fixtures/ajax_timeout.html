<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AJAX Timeout Test</title>
</head>
<body>
    <h1>AJAX Timeout Test Page</h1>
    <p>This page simulates a long-running AJAX request.</p>

    <script>
        // A local stub replaces the jQuery download, which can still be in
        // flight when the driver stops waiting for the page to load.
        window.jQuery = function () {
            return {length: 0};
        };

        // Simulate Drupal AJAX system
        window.Drupal = {
            ajax: {
                instances: [
                    { ajaxing: true }
                ]
            }
        };

        // Also simulate jQuery being active
        jQuery.active = 1;

        // Keep AJAX active for longer than any wait the test performs
        setTimeout(function() {
            window.Drupal.ajax.instances[0].ajaxing = false;
            jQuery.active = 0;
        }, 30000);
    </script>
</body>
</html>
