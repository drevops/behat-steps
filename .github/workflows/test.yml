name: Test

on:
  push:
    branches:
      - main
      - 3.x

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - 3.x

defaults:
  run:
    shell: bash

env:
  CI: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    env:
      TERM: xterm-256color
      PHP_VERSION: '8.4'
      DRUPAL_VERSION: '11'
      DEPS: 'normal'

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Process the codebase to run in CI
        run: |
          sed -i -e "/###/d" docker-compose.yml
          sed -i -e "s/##//" docker-compose.yml

      - name: Build stack
        run: |
          docker compose up -d --build
          docker cp -L . "$(docker compose ps -q cli)":/app/
        timeout-minutes: 30

      - name: Install development dependencies
        run: |
          if [ -n "${PACKAGE_TOKEN}" ]; then
            export COMPOSER_AUTH="{\"github-oauth\": {\"github.com\": \"${PACKAGE_TOKEN}\"}}"
          fi
          docker compose exec -e COMPOSER_AUTH -e COMPOSER_MEMORY_LIMIT=-1 -T cli composer --ansi install --prefer-dist
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Provision application
        run: docker compose exec -e DRUPAL_VERSION=${DRUPAL_VERSION} -e DEPS=${DEPS} -T cli php scripts/provision.php

      - name: Validate Composer configuration is normalized
        run: docker compose exec -T cli composer normalize --dry-run
        continue-on-error: ${{ vars.CI_COMPOSER_NORMALIZE_IGNORE_FAILURE == '1' }}

      - name: Install Ahoy CLI
        run: |
          # renovate: datasource=github-releases depName=ahoy-cli/ahoy
          version=3.0.2 && \
          set -x && curl -L -o "/usr/local/bin/ahoy" "https://github.com/ahoy-cli/ahoy/releases/download/v${version}/ahoy-bin-$(uname -s)-amd64" && \
          chmod +x /usr/local/bin/ahoy && \
          ahoy --version

      - name: Lint code
        run: ahoy lint
        continue-on-error: ${{ vars.CI_LINT_IGNORE_FAILURE == '1' }}

      - name: Lint documentation
        run: ahoy lint-docs
        continue-on-error: ${{ vars.CI_LINT_DOCS_IGNORE_FAILURE == '1' }}

  test:
    name: Test PHP ${{ matrix.php_version }}, Drupal ${{ matrix.drupal_version }}, Behat ${{ matrix.behat }}, Deps ${{ matrix.deps }}${{ matrix.driver && format(', Driver {0}', matrix.driver) || '' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php_version: '8.3'
            drupal_version: '11'
            behat: '3'
            deps: 'normal'
            coverage: true
          - php_version: '8.3'
            drupal_version: '11'
            behat: '3'
            deps: 'lowest'
          - php_version: '8.4'
            drupal_version: '11'
            behat: '3'
            deps: 'normal'
          - php_version: '8.4'
            drupal_version: '11'
            behat: '3'
            deps: 'lowest'
          - php_version: '8.5'
            drupal_version: '11'
            behat: '3'
            deps: 'normal'
          - php_version: '8.5'
            drupal_version: '11'
            behat: '3'
            deps: 'lowest'
          # Selenium-less driver legs: run the Behat suite through headless
          # Chrome over the DevTools Protocol to prove the steps are driver
          # portable. They stay on 'normal' deps, and between them they cover
          # every PHP version and both Behat majors - see "Test matrix" in
          # CONTRIBUTING.md.
          #
          # The first also carries coverage, so the branches only the Chrome
          # driver reaches are measured and merged with the Selenium2 coverage.
          - php_version: '8.3'
            drupal_version: '11'
            behat: '3'
            deps: 'normal'
            driver: 'chrome_headless'
            profile: 'chrome_headless'
            coverage: true
          - php_version: '8.5'
            drupal_version: '11'
            behat: '3'
            deps: 'normal'
            driver: 'chrome_headless'
            profile: 'chrome_headless'
          - php_version: '8.4'
            drupal_version: '11'
            behat: '4'
            deps: 'normal'
            driver: 'chrome_headless'
            profile: 'chrome_headless'
          - php_version: '8.3'
            drupal_version: '11'
            behat: '4'
            deps: 'normal'
          - php_version: '8.3'
            drupal_version: '11'
            behat: '4'
            deps: 'lowest'
          - php_version: '8.4'
            drupal_version: '11'
            behat: '4'
            deps: 'normal'
          - php_version: '8.4'
            drupal_version: '11'
            behat: '4'
            deps: 'lowest'
          - php_version: '8.5'
            drupal_version: '11'
            behat: '4'
            deps: 'normal'
          - php_version: '8.5'
            drupal_version: '11'
            behat: '4'
            deps: 'lowest'
          # PHP 8.5 on Behat 4 is the whole Drupal 12 grid - see "Drupal
          # versions" in CONTRIBUTING.md.
          - php_version: '8.5'
            drupal_version: '12'
            behat: '4'
            deps: 'normal'
          - php_version: '8.5'
            drupal_version: '12'
            behat: '4'
            deps: 'lowest'

    env:
      TERM: xterm-256color
      PHP_VERSION: ${{ matrix.php_version }}
      DRUPAL_VERSION: ${{ matrix.drupal_version }}
      DEPS: ${{ matrix.deps }}
      BEHAT: ${{ matrix.behat }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Process the codebase to run in CI
        run: |
          sed -i -e "/###/d" docker-compose.yml
          sed -i -e "s/##//" docker-compose.yml
          cat docker-compose.yml

      - name: Build stack
        run: |
          docker compose up -d --build
          docker cp -L . "$(docker compose ps -q cli)":/app/
        timeout-minutes: 30

      - name: Install development dependencies
        run: |
          if [ -n "${PACKAGE_TOKEN}" ]; then
            export COMPOSER_AUTH="{\"github-oauth\": {\"github.com\": \"${PACKAGE_TOKEN}\"}}"
          fi
          docker compose exec -e COMPOSER_AUTH -e COMPOSER_MEMORY_LIMIT=-1 -T cli composer --ansi install --prefer-dist
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Provision application
        run: docker compose exec -e DRUPAL_VERSION=${DRUPAL_VERSION} -e DEPS=${DEPS} -e BEHAT=${BEHAT} -T cli php scripts/provision.php

      - name: Install Ahoy CLI
        run: |
          # renovate: datasource=github-releases depName=ahoy-cli/ahoy
          version=3.0.2 && \
          set -x && curl -L -o "/usr/local/bin/ahoy" "https://github.com/ahoy-cli/ahoy/releases/download/v${version}/ahoy-bin-$(uname -s)-amd64" && \
          chmod +x /usr/local/bin/ahoy && \
          ahoy --version

      # A Behat profile changes how the suite is driven, not what the PHPUnit
      # suites cover, so those legs skip them rather than repeat them.
      - name: Run Unit and Kernel tests with coverage
        if: matrix.coverage && !matrix.profile
        run: ahoy test-coverage
        continue-on-error: ${{ vars.CI_TEST_IGNORE_FAILURE == '1' }}

      - name: Run Unit tests
        if: "!matrix.coverage && !matrix.profile"
        run: ahoy test-unit
        continue-on-error: ${{ vars.CI_TEST_IGNORE_FAILURE == '1' }}

      - name: Run Kernel tests
        if: "!matrix.coverage && !matrix.profile"
        run: ahoy test-kernel
        continue-on-error: ${{ vars.CI_TEST_IGNORE_FAILURE == '1' }}

      - name: Run BDD tests with coverage
        if: matrix.coverage
        run: ahoy test-bdd-coverage ${{ matrix.profile && format('-- -p {0}', matrix.profile) || '' }}
        continue-on-error: ${{ vars.CI_TEST_IGNORE_FAILURE == '1' }}

      - name: Run BDD tests
        if: "!matrix.coverage"
        run: ahoy test-bdd ${{ matrix.profile && format('-- -p {0}', matrix.profile) || '' }}
        continue-on-error: ${{ vars.CI_TEST_IGNORE_FAILURE == '1' }}

      - name: Process test logs and artifacts
        if: always()
        run: |
          mkdir -p .logs
          if docker compose ps --services --filter "status=running" | \
            grep -q cli && docker compose exec -T cli test -d /app/.logs; then
            docker compose cp cli:/app/.logs/. ".logs/"
          fi

      - name: Upload test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-artifacts-php${{ matrix.php_version }}-drupal${{ matrix.drupal_version }}-behat${{ matrix.behat }}-${{ matrix.deps }}${{ matrix.driver && format('-{0}', matrix.driver) || '' }}
          path: .logs
          include-hidden-files: true
          retention-days: 30

      - name: Upload code coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: matrix.coverage && env.CODECOV_TOKEN != ''
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: .logs/coverage
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Docs
    runs-on: ubuntu-latest

    permissions:
      contents: read # Read the documentation source.
      pull-requests: write # Post the Netlify preview link on the pull request.

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: docs

      # Links point at the pull request's head commit, or the pushed commit,
      # so a file the pull request adds resolves.
      - name: Build documentation site
        run: npm run build
        working-directory: docs
        env:
          DOCS_REF: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Test documentation
        run: npm test
        working-directory: docs

      - name: Install browser for accessibility checks
        run: npx playwright install --with-deps chromium
        working-directory: docs

      - name: Check documentation accessibility
        run: npm run test:accessibility
        working-directory: docs

      # A push to 'main' updates the development site, and any other build
      # deploys a preview. Fork pull requests get no secrets, so they skip it.
      - name: Deploy documentation to Netlify
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != '' }}
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4.0
        with:
          publish-dir: docs/build
          production-deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: Deploy from GitHub Actions
          enable-pull-request-comment: true
          overwrites-pull-request-comment: true
          enable-commit-comment: false
          enable-commit-status: false
          enable-github-deployment: false
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        timeout-minutes: 5
